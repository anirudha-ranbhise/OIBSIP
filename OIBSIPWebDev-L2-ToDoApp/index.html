<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive To-Do App</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <h2>Task Manager</h2>

        <!-- Input Area -->
        <div class="input-section">
            <input type="text" id="taskInput" placeholder="Add a new task...">
            <button id="addBtn">Add Task</button>
        </div>

        <!-- Task Counters -->
        <div class="counters">
            <span id="pendingCount">0 Pending</span>
            <span id="completedCount">0 Completed</span>
        </div>

        <!-- Lists Area -->
        <div class="task-lists">
            <div class="list-box">
                <h3>Pending Tasks</h3>
                <ul id="pendingList"></ul>
                <p id="emptyPending" class="empty-msg">No pending tasks.</p>
            </div>

            <div class="list-box">
                <h3>Completed Tasks</h3>
                <ul id="completedList"></ul>
                <p id="emptyCompleted" class="empty-msg">No completed tasks yet.</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
