<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="converter-container">
        <h2>Temperature Converter</h2>
        
        <div class="input-group">
            <label for="tempInput">Enter Temperature:</label>
            <input type="number" id="tempInput" placeholder="e.g. 32" step="any">
        </div>

        <div class="input-group">
            <label for="unitSelect">Select Input Unit:</label>
            <select id="unitSelect">
                <option value="celsius">Celsius (°C)</option>
                <option value="fahrenheit">Fahrenheit (°F)</option>
                <option value="kelvin">Kelvin (K)</option>
            </select>
        </div>

        <button onclick="convertTemperature()">Convert</button>

        <div class="results" id="resultsArea" style="display: none;">
            <h3>Results:</h3>
            <p id="celsiusResult"></p>
            <p id="fahrenheitResult"></p>
            <p id="kelvinResult"></p>
        </div>
        
        <p class="error-msg" id="errorMsg"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
