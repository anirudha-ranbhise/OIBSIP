<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Register — Auth System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="auth-container">
        <!-- Forms Wrapper -->
        <div id="formContainer">
            
            <!-- Login Form -->
            <div id="loginSection" class="form-section">
                <h2>Welcome Back</h2>
                <form id="loginForm">
                    <div class="input-group">
                        <label for="loginEmail">Email / Username</label>
                        <input type="text" id="loginEmail" required>
                    </div>
                    <div class="input-group">
                        <label for="loginPassword">Password</label>
                        <input type="password" id="loginPassword" required>
                    </div>
                    <button type="submit" class="btn-submit">Login</button>
                    <p class="error-msg" id="loginError"></p>
                </form>
                <p class="switch-text">Don't have an account? <a href="#" id="showRegister">Register here</a></p>
            </div>

            <!-- Register Form -->
            <div id="registerSection" class="form-section" style="display: none;">
                <h2>Create Account</h2>
                <form id="registerForm">
                    <div class="input-group">
                        <label for="regUsername">Username</label>
                        <input type="text" id="regUsername" required>
                    </div>
                    <div class="input-group">
                        <label for="regEmail">Email</label>
                        <input type="email" id="regEmail" required>
                    </div>
                    <div class="input-group">
                        <label for="regPassword">Password (Min 8 chars, 1 number)</label>
                        <input type="password" id="regPassword" required>
                    </div>
                    <button type="submit" class="btn-submit">Register</button>
                    <p class="error-msg" id="registerError"></p>
                </form>
                <p class="switch-text">Already have an account? <a href="#" id="showLogin">Login here</a></p>
            </div>

        </div>
    </div>

    <script>
        // Simple View Toggling and Mock Auth Logic
        const loginSection = document.getElementById('loginSection');
        const registerSection = document.getElementById('registerSection');
        const showRegister = document.getElementById('showRegister');
        const showLogin = document.getElementById('showLogin');

        showRegister.addEventListener('click', (e) => {
            e.preventDefault();
            loginSection.style.display = 'none';
            registerSection.style.display = 'block';
        });

        showLogin.addEventListener('click', (e) => {
            e.preventDefault();
            registerSection.style.display = 'none';
            loginSection.style.display = 'block';
        });

        // Register Logic
        document.getElementById('registerForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const username = document.getElementById('regUsername').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const err = document.getElementById('registerError');

            if (password.length < 8 || !/\d/.test(password)) {
                err.textContent = 'Password must be at least 8 characters and contain a number.';
                return;
            }

            let users = JSON.parse(localStorage.getItem('oibsip_users')) || [];
            if (users.some(u => u.email === email)) {
                err.textContent = 'User with this email already exists.';
                return;
            }

            users.push({ username, email, password });
            localStorage.setItem('oibsip_users', JSON.stringify(users));
            alert('Registration successful! Please login.');
            registerSection.style.display = 'none';
            loginSection.style.display = 'block';
        });

        // Login Logic
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const identifier = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const err = document.getElementById('loginError');

            let users = JSON.parse(localStorage.getItem('oibsip_users')) || [];
            const user = users.find(u => (u.email === identifier || u.username === identifier) && u.password === password);

            if (!user) {
                err.textContent = 'Invalid username/email or password.';
                return;
            }

            localStorage.setItem('oibsip_current_user', JSON.stringify(user));
            window.location.href = 'dashboard.html';
        });
    </script>
</body>
</html>
